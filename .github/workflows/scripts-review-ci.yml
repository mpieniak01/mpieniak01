name: Research Scripts Review CI

on:
  pull_request:
    paths:
      - "research-venom/tools/**"
      - "research-venom/config/**"
      - "research-venom/docs/**"
      - "research-venom/tests/**"
      - "research-venom/artifacts/inputs/**"
      - ".github/workflows/scripts-review-ci.yml"
      - "research-venom/.github/copilot-instructions.md"
      - "research-venom/README.md"
      - "research-venom/Makefile"
      - "research-venom/pytest.ini"
      - "research-venom/.gitignore"

jobs:
  python-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-venom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Static checks
        run: make test-static PYTHON=python

      - name: Validate input-mode contract (CI sample vs local real)
        run: make verify-input-mode-contract-ci PYTHON=python

      - name: Logic contract tests
        run: make test-contracts PYTHON=python

      - name: Export dry-run (config profile)
        run: |
          python tools/export_research_pack.py \
            --repo-root "$GITHUB_WORKSPACE/research-venom" \
            --config "$GITHUB_WORKSPACE/research-venom/config/process_pipeline_v04_test.json" \
            --profile scripts_review \
            --dry-run

      - name: Validate active pipeline version is v04
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/process_pipeline_v04.json").read_text(encoding="utf-8"))
          version = str(cfg.get("project", {}).get("config_version", "")).strip().lower()
          if version != "v04":
              raise SystemExit(f"active config_version must be v04, got: {version!r}")
          print("active pipeline version check ok")
          PY
          if command -v rg >/dev/null 2>&1; then
            rg -n "process_pipeline_v04.json" README.md docs/CHART_CONTROL_V4.md docs/VISUALIZATION_V4_STABILITY_CONTRACT.md >/dev/null
          else
            grep -R -n "process_pipeline_v04.json" README.md docs/CHART_CONTROL_V4.md docs/VISUALIZATION_V4_STABILITY_CONTRACT.md >/dev/null
          fi

      - name: Legacy reference audit (205J)
        run: |
          python tools/report_alias_coverage.py \
            --config "$GITHUB_WORKSPACE/research-venom/config/process_pipeline_v04_test.json" \
            --out-json "$GITHUB_WORKSPACE/research-venom/artifacts/meta/legacy_reference_audit_ci.json" \
            --out-md "$GITHUB_WORKSPACE/research-venom/artifacts/meta/legacy_reference_audit_ci.md"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/meta/legacy_reference_audit_ci.json").read_text(encoding="utf-8"))
          legacy_refs = int(report["summary"]["legacy_refs_in_active_config"])
          expected = int(report["summary"]["legacy_refs_expected"])
          ok = bool(report["summary"]["legacy_refs_ok"])
          if legacy_refs != expected or not ok:
              raise SystemExit(f"legacy_refs_in_active_config must be {expected}, got {legacy_refs}")
          print("legacy reference audit ok")
          PY

      - name: Anti-regression (legacy names/paths)
        run: |
          if command -v rg >/dev/null 2>&1; then
            ! rg -n "docs_dev/_to_do/205_artifacts" tools config docs README.md .github/copilot-instructions.md
            ! rg -n "205C_github_market_benchmark_q1.py|205D_github_pr_flow_q1.py|205E_github_closed_pr_analysis.py|205f_.*\\.(py|ps1)" tools config docs README.md .github/copilot-instructions.md
            ! rg -n "205f_pipeline_config_v01.json|205_export_manifest_v01.txt|205_export_manifest_scripts_review_v01.txt|OPERATIONS\\.md|PR_205_REVIEW\\.md|tools/README\\.md" tools config docs README.md .github/copilot-instructions.md
          else
            ! grep -R -n "docs_dev/_to_do/205_artifacts" tools config docs README.md .github/copilot-instructions.md
            ! grep -R -n -E "205C_github_market_benchmark_q1.py|205D_github_pr_flow_q1.py|205E_github_closed_pr_analysis.py|205f_.*\\.(py|ps1)" tools config docs README.md .github/copilot-instructions.md
            ! grep -R -n -E "205f_pipeline_config_v01.json|205_export_manifest_v01.txt|205_export_manifest_scripts_review_v01.txt|OPERATIONS\\.md|PR_205_REVIEW\\.md|tools/README\\.md" tools config docs README.md .github/copilot-instructions.md
          fi

  powershell-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-venom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parse check
        run: make test-powershell-parse
